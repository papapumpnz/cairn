name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Documentation tests
        run: cargo test --locked --workspace --doc
      - name: Repository policy
        run: cargo run --locked -p cairn-check -- check .
      - name: Schemas and runtime attestation
        run: bash scripts/validate_schemas.sh
      - name: WP00 acceptance evidence
        run: bash scripts/wp00_acceptance.sh artifacts/wp00-ci
