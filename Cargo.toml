[workspace]
members = [
  "crates/cairn-bytecode",
  "crates/cairn-cas",
  "crates/cairn-check",
  "crates/cairn-core",
  "crates/cairn-invent",
  "crates/cairn-memory",
  "crates/cairn-reg",
  "crates/cairn-rkl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
repository = "https://example.invalid/cairn"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
