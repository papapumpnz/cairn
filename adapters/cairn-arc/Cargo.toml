[package]
name = "cairn-arc"
description = "Quarantined ARC JSON adapter for the generic CAIRN learner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "cairn-arc-attempt"

[[bin]]
name = "cairn-arc-attempt"
path = "src/bin/cairn-arc-attempt.rs"

[[bin]]
name = "cairn-arc-batch"
path = "src/bin/cairn-arc-batch.rs"

[[bin]]
name = "cairn-arc-failure-audit"
path = "src/bin/cairn-arc-failure-audit.rs"

[dependencies]
cairn-core = { path = "../../crates/cairn-core" }
cairn-field = { path = "../../crates/cairn-field" }
cairn-invent = { path = "../../crates/cairn-invent" }
cairn-rkl = { path = "../../crates/cairn-rkl" }
cairn-reg = { path = "../../crates/cairn-reg" }
cairn-runtime = { path = "../../crates/cairn-runtime" }
serde = { version = "=1.0.217", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.133", default-features = false, features = ["std"] }

[dev-dependencies]
cairn-curriculum = { path = "../../crates/cairn-curriculum" }
cairn-distill = { path = "../../crates/cairn-distill" }
cairn-teacher-spool = { path = "../../crates/cairn-teacher-spool" }
cairn-theory = { path = "../../crates/cairn-theory" }
cairn-vector = { path = "../cairn-vector" }
cairn-verifier = { path = "../../crates/cairn-verifier" }
cairn-memory = { path = "../../crates/cairn-memory" }
cairn-mechanism = { path = "../../crates/cairn-mechanism" }

[lints]
workspace = true
