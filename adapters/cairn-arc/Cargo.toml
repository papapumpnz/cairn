[package]
name = "cairn-arc"
description = "Quarantined ARC JSON adapter for the generic CAIRN learner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "cairn-arc-attempt"

[[bin]]
name = "cairn-arc-attempt"
path = "src/bin/cairn-arc-attempt.rs"

[[bin]]
name = "cairn-arc-batch"
path = "src/bin/cairn-arc-batch.rs"

[dependencies]
cairn-field = { path = "../../crates/cairn-field" }
cairn-invent = { path = "../../crates/cairn-invent" }
cairn-rkl = { path = "../../crates/cairn-rkl" }
serde = { version = "=1.0.217", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.133", default-features = false, features = ["std"] }

[lints]
workspace = true
