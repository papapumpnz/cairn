schema_version = 1

# Layers are ordered from least to most privileged. A crate may depend on its
# own layer or an earlier layer, except where `allowed_dependencies` narrows it.
layers = [
  "governance",
  "substrate",
  "evidence",
  "language",
  "execution",
  "verification",
  "synthesis",
  "memory",
  "swarm",
  "frontend",
  "benchmark",
  "evaluation",
  "integration",
]

[crates.cairn-check]
layer = "governance"
allow_unsafe_modules = []

[crates.cairn-core]
layer = "substrate"
allow_unsafe_modules = []

[crates.cairn-cas]
layer = "substrate"
allow_unsafe_modules = []

[crates.cairn-rkl]
layer = "language"
allow_unsafe_modules = []

[crates.cairn-reg]
layer = "evidence"
allow_unsafe_modules = []

[crates.cairn-entity]
layer = "evidence"
allow_unsafe_modules = []

[crates.cairn-events]
layer = "evidence"
allow_unsafe_modules = []

[crates.cairn-bytecode]
layer = "execution"
allow_unsafe_modules = []

[crates.cairn-proof]
layer = "verification"
allow_unsafe_modules = []

[crates.cairn-invent]
layer = "synthesis"
allow_unsafe_modules = []

[crates.cairn-theory]
layer = "synthesis"
allow_unsafe_modules = []

[crates.cairn-cegis]
layer = "synthesis"
allow_unsafe_modules = []

[crates.cairn-memory]
layer = "memory"
allow_unsafe_modules = []

[crates.cairn-world]
layer = "synthesis"
allow_unsafe_modules = []

[crates.cairn-field]
layer = "frontend"
allow_unsafe_modules = []

[crates.cairn-arc]
layer = "benchmark"
allow_unsafe_modules = []
